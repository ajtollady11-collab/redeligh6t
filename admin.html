<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orders | AURELI</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F7F2EA">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' fill='%23000'/><text x='32' y='44' font-family='Georgia,serif' font-size='36' fill='%23F7F2EA' text-anchor='middle'>A</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ivory:#F7F2EA;--sand:#EEE5D7;--linen:#E2D6C4;--taupe:#8A7A6A;--stone:#5E5247;--ink:#1D1A17;--black:#000;--white:#fff;
  --ok:#2F5D3A;--ok-bg:#E3EBDD;--warn:#8a2f24;--warn-bg:#F3E1DC;
  --serif:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --sans:"Jost","Futura","Avenir Next","Helvetica Neue",Arial,sans-serif;
  --gutter:clamp(16px,4vw,40px);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ivory);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--black);outline-offset:2px}
[hidden]{display:none!important}
.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border:1px solid var(--black);background:var(--black);color:var(--ivory);border-radius:2px;font-size:14px;font-weight:500;letter-spacing:.02em;cursor:pointer;white-space:nowrap}
.btn:hover{background:#2a2622}
.btn.ghost{background:transparent;color:var(--ink);border-color:rgba(29,26,23,.3)}
.btn.ghost:hover{border-color:var(--ink);background:transparent}
.btn[disabled]{opacity:.6;cursor:progress}
input,textarea{width:100%;background:var(--white);border:1px solid rgba(29,26,23,.25);border-radius:2px;padding:0 12px;font-size:15px}
input{height:44px}
textarea{padding:10px 12px;min-height:72px;resize:vertical}
input:focus,textarea:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
label{display:block;font-size:12.5px;color:var(--stone);margin-bottom:4px}

/* Login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px var(--gutter)}
.login form{width:100%;max-width:380px}
.login .logo{display:block;text-align:center;margin-bottom:32px}
.login h1{font-family:var(--serif);font-weight:400;font-size:30px;margin:0 0 6px}
.login p{color:var(--stone);margin:0 0 24px}
.login .btn{width:100%;margin-top:16px;min-height:50px}
.login .err{color:var(--warn);font-size:14px;margin-top:12px}

.logo{font-family:var(--serif);font-size:20px;letter-spacing:.34em;padding-left:.34em;font-weight:500;text-decoration:none}

/* App shell */
.top{position:sticky;top:0;z-index:10;background:rgba(247,242,234,.95);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--linen)}
.top .in{max-width:1180px;margin:0 auto;padding:0 var(--gutter);min-height:60px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.top .actions{display:flex;gap:8px;align-items:center}
.top small{color:var(--taupe);font-size:12.5px}
@media (max-width:640px){.top .hide-s{display:none}}

main{max-width:1180px;margin:0 auto;padding:24px var(--gutter) 80px}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:18px}
.tabs{display:flex;gap:4px;background:var(--sand);padding:4px;border-radius:2px}
.tabs button{border:0;background:none;padding:8px 14px;min-height:40px;border-radius:2px;cursor:pointer;font-size:14px;color:var(--stone)}
.tabs button[aria-selected="true"]{background:var(--white);color:var(--ink);font-weight:500;box-shadow:0 0 0 1px var(--linen)}
.tabs b{font-weight:500;margin-left:6px;font-variant-numeric:tabular-nums}
.search{flex:1;min-width:220px;max-width:360px}
.notice{padding:14px 16px;margin-bottom:18px;border:1px solid var(--linen);background:var(--white);font-size:14px}
.notice.warn{background:var(--warn-bg);border-color:#e6c6bd;color:var(--warn)}
.empty{padding:56px 16px;text-align:center;color:var(--stone)}

/* Order card */
.order{background:var(--white);border:1px solid var(--linen);margin-bottom:12px}
.order.done{background:#FBF9F5}
.o-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:14px 18px;border-bottom:1px solid var(--linen)}
.o-ref{font-weight:500;font-size:15.5px}
.o-date{color:var(--taupe);font-size:13.5px}
.pill{font-size:11.5px;letter-spacing:.06em;font-weight:500;padding:3px 8px;border-radius:999px;background:var(--sand);color:var(--stone)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.o-total{margin-left:auto;font-weight:500;font-variant-numeric:tabular-nums}
.o-body{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:0}
@media (max-width:820px){.o-body{grid-template-columns:minmax(0,1fr)}}
.col{padding:16px 18px;min-width:0}
.col + .col{border-left:1px solid var(--linen)}
@media (max-width:820px){.col + .col{border-left:0;border-top:1px solid var(--linen)}}
.h{font-size:11.5px;letter-spacing:.08em;color:var(--taupe);font-weight:500;margin:0 0 6px}
.who{font-weight:500;font-size:16px}
.contact{margin-top:2px;font-size:14px;color:var(--stone);word-break:break-word}
.contact a{color:var(--stone)}
.addr{margin-top:14px;display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.addr address{font-style:normal;white-space:pre-line;font-size:15px}
.copy{flex:none;min-height:36px;padding:0 12px;font-size:13px}
.items{margin-top:14px;font-size:14px}
.items li{margin:2px 0}
.items ul{margin:0;padding-left:18px}
.sn{margin-top:10px;font-size:13.5px;color:var(--stone)}

.tick{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--linen);background:var(--ivory);cursor:pointer;user-select:none;min-height:52px}
.tick input{width:22px;height:22px;margin:0;accent-color:var(--black);flex:none;cursor:pointer}
.tick span{font-weight:500}
.tick small{display:block;font-weight:400;color:var(--taupe);font-size:12.5px}
.order.done .tick{background:var(--ok-bg);border-color:#cddcc6}
.grid2{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;margin-top:12px}
@media (max-width:480px){.grid2{grid-template-columns:1fr}}
.field{margin-top:10px}
.save-row{display:flex;align-items:center;gap:12px;margin-top:12px}
.status{font-size:13px;color:var(--taupe)}
.status.err{color:var(--warn)}
.trk{margin-top:8px;font-size:13.5px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--black);color:var(--ivory);padding:10px 16px;font-size:14px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>

<!-- Sign in -->
<section class="login" id="loginView" hidden>
  <form id="loginForm" novalidate>
    <span class="logo">AURELI</span>
    <h1>Orders</h1>
    <p>Sign in to see and fulfil orders.</p>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <button class="btn" type="submit" id="loginBtn">Sign in</button>
    <p class="err" id="loginErr" role="alert" hidden></p>
  </form>
</section>

<!-- Dashboard -->
<div id="appView" hidden>
  <header class="top">
    <div class="in">
      <a class="logo" href="/" title="Open the shop">AURELI</a>
      <div class="actions">
        <small id="updated" class="hide-s"></small>
        <button class="btn ghost" type="button" id="refreshBtn">Refresh</button>
        <button class="btn ghost hide-s" type="button" id="csvBtn">Export CSV</button>
        <button class="btn ghost" type="button" id="logoutBtn">Sign out</button>
      </div>
    </div>
  </header>
  <main>
    <div class="notice warn" id="loadErr" role="alert" hidden></div>
    <div class="bar">
      <div class="tabs" role="tablist" aria-label="Order status">
        <button role="tab" aria-selected="true" data-tab="todo">To fulfil<b id="cTodo">0</b></button>
        <button role="tab" aria-selected="false" data-tab="done">Fulfilled<b id="cDone">0</b></button>
        <button role="tab" aria-selected="false" data-tab="all">All<b id="cAll">0</b></button>
      </div>
      <div class="search">
        <label class="sr-only" for="q">Search orders</label>
        <input id="q" type="search" placeholder="Search name, email, postcode or order no." autocomplete="off">
      </div>
    </div>
    <div id="list" aria-live="polite"></div>
  </main>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
const $ = s => document.querySelector(s);
const esc = t => String(t ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" })[c]);
const COUNTRY = new Proxy({}, { get: (_, c) => { try { return new Intl.DisplayNames(["en"], { type: "region" }).of(c); } catch (e) { return c; } } });
const CARRIERS = ["Royal Mail","Evri","DPD","DHL","Parcelforce","UPS","USPS","FedEx","Yodel"];
let ORDERS = [], tab = "todo", lastLoad = 0, loading = false;

function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2200); }
const fmtMoney = m => m ? new Intl.NumberFormat(m.currency === "USD" ? "en-US" : "en-GB", { style:"currency", currency:m.currency }).format(m.amount / 100) : "";
const fmtDate = d => new Date(d).toLocaleString("en-GB", { day:"numeric", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit" });
const addressText = a => [a.line1, a.line2, a.city, a.region, a.postcode, COUNTRY[a.country] || a.country].filter(Boolean).join("\n");

async function api(method, body){
  const r = await fetch("/api/admin", {
    method, credentials: "same-origin",
    headers: body ? { "Content-Type": "application/json" } : {},
    body: body ? JSON.stringify(body) : undefined
  });
  const data = await r.json().catch(() => ({}));
  return { ok: r.ok, status: r.status, data };
}

function show(view){ $("#loginView").hidden = view !== "login"; $("#appView").hidden = view !== "app"; if (view === "login") setTimeout(() => $("#pw").focus(), 30); }

/* ---------- sign in / out ---------- */
$("#loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = $("#loginBtn"), err = $("#loginErr");
  if (!$("#pw").value) { err.textContent = "Enter the dashboard password."; err.hidden = false; return; }
  btn.disabled = true; btn.textContent = "Signing in…"; err.hidden = true;
  const r = await api("POST", { action: "login", password: $("#pw").value });
  btn.disabled = false; btn.textContent = "Sign in";
  if (r.ok) { $("#pw").value = ""; show("app"); load(); return; }
  err.textContent = r.data.message || "Couldn't sign in. Try again.";
  err.hidden = false; $("#pw").select();
});
$("#logoutBtn").addEventListener("click", async () => { await api("POST", { action: "logout" }); ORDERS = []; $("#list").innerHTML = ""; show("login"); });

/* ---------- load ---------- */
async function load(quiet){
  if (loading) return; loading = true;
  const btn = $("#refreshBtn"); btn.disabled = true; btn.textContent = "Refreshing…";
  if (!quiet && !ORDERS.length) $("#list").innerHTML = '<p class="empty">Loading orders…</p>';
  const r = await api("GET");
  loading = false; btn.disabled = false; btn.textContent = "Refresh";
  if (r.status === 401) { show("login"); return; }
  if (!r.ok) { $("#loadErr").textContent = "Couldn't load orders: " + (r.data.message || "error " + r.status); $("#loadErr").hidden = false; if (!ORDERS.length) $("#list").innerHTML = ""; return; }
  $("#loadErr").hidden = true;
  ORDERS = r.data.orders || []; lastLoad = Date.now();
  $("#updated").textContent = "Updated " + new Date().toLocaleTimeString("en-GB", { hour:"2-digit", minute:"2-digit" });
  render();
}
$("#refreshBtn").addEventListener("click", () => load());

/* ---------- render ---------- */
const isDone = o => !!(o.fulfilment && o.fulfilment.fulfilled_at);
function matches(o, q){
  if (!q) return true;
  const hay = [o.ref, o.id, o.customer.name, o.customer.email, o.customer.phone, o.address.postcode, o.address.city, o.address.line1, o.fulfilment.tracking].join(" ").toLowerCase();
  return q.split(/\s+/).every(w => hay.includes(w));
}
function visible(){
  const q = $("#q").value.trim().toLowerCase();
  return ORDERS.filter(o => matches(o, q) && (tab === "all" || (tab === "done" ? isDone(o) : !isDone(o))));
}
function render(){
  $("#cTodo").textContent = ORDERS.filter(o => !isDone(o)).length;
  $("#cDone").textContent = ORDERS.filter(isDone).length;
  $("#cAll").textContent = ORDERS.length;
  const rows = tab === "todo" ? visible().slice().reverse() : visible(); // oldest first when fulfilling
  if (!rows.length) {
    $("#list").innerHTML = `<p class="empty">${$("#q").value ? "No orders match that search." : tab === "todo" ? "Nothing to fulfil. All caught up." : tab === "done" ? "No fulfilled orders yet." : "No paid orders yet."}</p>`;
    return;
  }
  $("#list").innerHTML = rows.map(card).join("");
}
function card(o){
  const f = o.fulfilment || {}, done = isDone(o);
  const qty = o.items.reduce((n, i) => n + i.quantity, 0);
  const items = o.items.map(i => `<li>${esc(i.name)} × ${i.quantity}</li>`).join("") +
    `<li>3 free gifts × ${qty} (jade roller, ice roller, gua sha)</li>`;
  const disabled = o.locked ? "disabled" : "";
  return `<article class="order${done ? " done" : ""}" data-id="${esc(o.id)}">
    <div class="o-head">
      <span class="o-ref">${esc(o.ref)}</span>
      <span class="o-date">${fmtDate(o.created_at)}</span>
      <span class="pill" title="Shipping country">${esc(o.country === "GB" ? "UK" : (o.country || (o.market === "US" ? "US" : "UK")))}</span>
      ${done ? '<span class="pill ok">Fulfilled</span>' : '<span class="pill">To fulfil</span>'}
      ${o.refunded ? '<span class="pill warn">Refunded</span>' : ""}
      <span class="o-total">${fmtMoney(o.total)}</span>
    </div>
    <div class="o-body">
      <div class="col">
        <p class="h">SHIP TO</p>
        <div class="who">${esc(o.customer.name) || "<em>No name</em>"}</div>
        <div class="contact">
          ${o.customer.email ? `<a href="mailto:${esc(o.customer.email)}">${esc(o.customer.email)}</a>` : ""}
          ${o.customer.email && o.customer.phone ? " · " : ""}
          ${o.customer.phone ? `<a href="tel:${esc(o.customer.phone)}">${esc(o.customer.phone)}</a>` : ""}
        </div>
        <div class="addr">
          <address>${esc(o.customer.name ? o.customer.name + "\n" : "")}${esc(addressText(o.address)) || "No address on this order"}</address>
          <button class="btn ghost copy" type="button" data-copy>Copy address</button>
        </div>
        <div class="items"><p class="h">ITEMS</p><ul>${items}</ul></div>
        ${o.shipping_note ? `<p class="sn">Customer note: ${esc(o.shipping_note)}</p>` : ""}
      </div>
      <div class="col">
        ${o.locked ? '<p class="sn" style="margin:0 0 10px">Completed in Square, so it can\'t be changed here.</p>' : ""}
        <label class="tick">
          <input type="checkbox" data-tick ${done ? "checked" : ""} ${disabled} aria-label="Mark ${esc(o.ref)} as fulfilled">
          <span>Fulfilled<small>${done ? "Ticked " + fmtDate(f.fulfilled_at) : "Tick once it's packed and sent"}</small></span>
        </label>
        <div class="grid2">
          <div><label for="c-${esc(o.id)}">Carrier</label><input id="c-${esc(o.id)}" data-f="carrier" maxlength="40" list="carriers" value="${esc(f.carrier || "")}" ${disabled}></div>
          <div><label for="t-${esc(o.id)}">Tracking number</label><input id="t-${esc(o.id)}" data-f="tracking" maxlength="60" value="${esc(f.tracking || "")}" autocomplete="off" ${disabled}></div>
        </div>
        <div class="field"><label for="u-${esc(o.id)}">Tracking link (optional)</label><input id="u-${esc(o.id)}" data-f="tracking_url" maxlength="250" type="url" inputmode="url" value="${esc(f.tracking_url || "")}" ${disabled}></div>
        <div class="field"><label for="n-${esc(o.id)}">Private note <span style="color:var(--taupe)">(up to 250 characters)</span></label><textarea id="n-${esc(o.id)}" data-f="note" maxlength="250" ${disabled}>${esc(f.note || "")}</textarea></div>
        <div class="save-row">
          <button class="btn" type="button" data-save ${disabled}>Save</button>
          <span class="status" data-status>${f.updated_at ? "Last saved " + fmtDate(f.updated_at) : ""}</span>
        </div>
        ${f.tracking_url ? `<p class="trk"><a href="${esc(f.tracking_url)}" target="_blank" rel="noopener">Open tracking page</a></p>` : ""}
      </div>
    </div>
  </article>`;
}

/* ---------- actions ---------- */
async function save(id, patch, el){
  const status = el.querySelector("[data-status]");
  status.className = "status"; status.textContent = "Saving…";
  const r = await api("POST", Object.assign({ action: "update", id }, patch));
  if (r.status === 401) { show("login"); return false; }
  if (!r.ok) { status.className = "status err"; status.textContent = r.data.message || "Couldn't save. Try again."; return false; }
  const o = ORDERS.find(x => x.id === id); if (o) o.fulfilment = r.data.fulfilment;
  return true;
}
$("#list").addEventListener("change", async e => {
  if (!e.target.matches("[data-tick]")) return;
  const el = e.target.closest(".order"), id = el.dataset.id, checked = e.target.checked;
  e.target.disabled = true;
  const ok = await save(id, { fulfilled: checked }, el);
  if (!ok) { e.target.checked = !checked; e.target.disabled = false; return; }
  const o = ORDERS.find(x => x.id === id);
  toast(checked ? o.ref + " marked fulfilled" : o.ref + " moved back to To fulfil");
  render();
});
$("#list").addEventListener("click", async e => {
  const el = e.target.closest(".order"); if (!el) return;
  const id = el.dataset.id, o = ORDERS.find(x => x.id === id);
  if (e.target.closest("[data-copy]")) {
    const text = [o.customer.name, addressText(o.address)].filter(Boolean).join("\n");
    try { await navigator.clipboard.writeText(text); toast("Address copied"); }
    catch (err) { toast("Couldn't copy. Select the address and copy it instead."); }
  }
  if (e.target.closest("[data-save]")) {
    const btn = e.target.closest("[data-save]"); btn.disabled = true;
    const patch = {}; el.querySelectorAll("[data-f]").forEach(i => patch[i.dataset.f] = i.value);
    const ok = await save(id, patch, el);
    btn.disabled = false;
    if (ok) { toast("Saved " + o.ref); render(); }
  }
});

/* ---------- tabs, search, CSV ---------- */
document.querySelectorAll("[data-tab]").forEach(b => b.addEventListener("click", () => {
  tab = b.dataset.tab;
  document.querySelectorAll("[data-tab]").forEach(x => x.setAttribute("aria-selected", String(x === b)));
  render();
}));
$("#q").addEventListener("input", render);
$("#csvBtn").addEventListener("click", () => {
  const rows = visible();
  if (!rows.length) { toast("No orders to export"); return; }
  const head = ["Order","Date","Name","Email","Phone","Address 1","Address 2","City","County/State","Postcode","Country","Wands","Total","Fulfilled","Carrier","Tracking"];
  const q = v => '"' + String(v ?? "").replace(/"/g, '""') + '"';
  const lines = rows.map(o => [o.ref, o.created_at, o.customer.name, o.customer.email, o.customer.phone, o.address.line1, o.address.line2, o.address.city, o.address.region, o.address.postcode, o.address.country,
    o.items.reduce((n, i) => n + i.quantity, 0), fmtMoney(o.total), o.fulfilment.fulfilled_at || "", o.fulfilment.carrier || "", o.fulfilment.tracking || ""].map(q).join(","));
  const blob = new Blob([head.map(q).join(",") + "\n" + lines.join("\n")], { type: "text/csv" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = "aureli-orders-" + tab + "-" + new Date().toISOString().slice(0, 10) + ".csv";
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});

/* Refresh every 2 minutes while the tab is open, unless you're typing in an order. */
setInterval(() => {
  if (document.hidden || $("#appView").hidden) return;
  if (document.activeElement && document.activeElement.closest && document.activeElement.closest(".order")) return;
  if (Date.now() - lastLoad > 110000) load(true);
}, 30000);

/* Start: try loading; the server says if we need to sign in. */
const dl = document.createElement("datalist"); dl.id = "carriers"; dl.innerHTML = CARRIERS.map(c => `<option value="${c}">`).join(""); document.body.appendChild(dl);
(async () => {
  const r = await api("GET");
  if (r.status === 401) { show("login"); return; }
  if (r.status === 503 && r.data.error === "setup" && /DASHBOARD_PASSWORD/.test(r.data.message || "")) {
    show("login"); $("#loginErr").textContent = r.data.message; $("#loginErr").hidden = false; return;
  }
  show("app");
  if (!r.ok) { $("#loadErr").textContent = "Couldn't load orders: " + (r.data.message || "error " + r.status); $("#loadErr").hidden = false; return; }
  ORDERS = r.data.orders || []; lastLoad = Date.now();
  $("#updated").textContent = "Updated " + new Date().toLocaleTimeString("en-GB", { hour:"2-digit", minute:"2-digit" });
  render();
})();
</script>
</body>
</html>
